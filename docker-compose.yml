# ============================================================
# Urban Nest — Enterprise Docker Compose Orchestration
# Services: PostgreSQL 15, Spring Boot 3 Backend, React Nginx Frontend
# ============================================================

version: '3.8'

services:
  # ─── 1. PostgreSQL Database ──────────────────────────────
  db:
    image: postgres:15-alpine
    container_name: urban-nest-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-urban_nest}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./database/migrations/schema_mnc_upgrade.sql:/docker-entrypoint-initdb.d/01_schema_mnc_upgrade.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-urban_nest}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - urban-nest-net

  # ─── 2. Spring Boot Backend ──────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: urban-nest-backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-urban_nest}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-postgres}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      SPRING_JPA_PROPERTIES_HIBERNATE_DIALECT: org.hibernate.dialect.PostgreSQLDialect
      JWT_SECRET: ${JWT_SECRET:-404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
      SERVER_PORT: 8083
      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME:-}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY:-}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET:-}
      CORS_ALLOWED_ORIGINS: http://localhost,http://localhost:80,http://localhost:5173
    ports:
      - "8083:8083"
    networks:
      - urban-nest-net

  # ─── 3. React Frontend with Nginx ─────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: urban-nest-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${FRONTEND_PORT:-80}:80"
    networks:
      - urban-nest-net

# ─── Persistent Volumes & Networks ──────────────────────────
volumes:
  pgdata:
    name: urban-nest-pgdata

networks:
  urban-nest-net:
    name: urban-nest-network
    driver: bridge
